name: Release

on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate release version
        id: version
        run: |
          # Get current version from pom.xml (strip -SNAPSHOT)
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.version-bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          RELEASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"

          echo "release-version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next-version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RELEASE_VERSION}"
          echo "Next dev version: ${NEXT_VERSION}"

      - name: Set release version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.release-version }} -DgenerateBackupPoms=false

      - name: Build and verify
        run: mvn -B verify --file pom.xml

      - name: Create release tag from trunk
        run: |
          git tag "v${{ steps.version.outputs.release-version }}" HEAD
          git push origin "v${{ steps.version.outputs.release-version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release-version }}
          name: v${{ steps.version.outputs.release-version }}
          generate_release_notes: true
          files: |
            target/msk-config-providers-${{ steps.version.outputs.release-version }}.jar
            target/shade-uber/msk-config-providers-${{ steps.version.outputs.release-version }}-all.jar

      - name: Create version bump PR
        run: |
          BRANCH="chore/bump-to-${{ steps.version.outputs.next-version }}"
          git checkout -b "$BRANCH"
          mvn -B versions:set -DnewVersion=${{ steps.version.outputs.next-version }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: bump to ${{ steps.version.outputs.next-version }}"
          git push origin "$BRANCH"
          gh pr create \
            --base trunk \
            --head "$BRANCH" \
            --title "chore: bump to ${{ steps.version.outputs.next-version }}" \
            --body "Automated version bump after release v${{ steps.version.outputs.release-version }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
